type lollypopType {
    id: ID!
    topColor: String!
    middleColor: String!
    bottomColor: String!
    to: String!
    message: String!
    from: String!
}

type Query {
    allLollypop: [lollypopType]
    getLollypopById(pathId: String!): lollypopType
}

type Mutation {
    addLollypop(
        id: ID!
        topColor: String!
        middleColor: String!
        bottomColor: String!
        to: String!
        message: String!
        from: String!
    ): lollypopType
}